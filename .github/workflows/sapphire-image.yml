name: sapphire BakaSU+susfs (Image + AnyKernel3)
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Commits de Angel (kernel_xiaomi_sapphire) que llevan las ROM publicadas
        base:
          - 3a2cfe72b3b05983f7b5594094f9572b38c36c04   # 5.15.194, Lunaris 3.13 2026111612
          - 097cabf8b0a961e3cd2bc9ad9a08168a6088d0ff   # 5.15.220, Lunaris 3.13 2026111709
    steps:
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Código del kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 1
      - name: Scripts de CI
        uses: actions/checkout@v4
        with:
          path: cisrc
          sparse-checkout: ci
          fetch-depth: 1
      - name: Dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio lz4 dwarves python3 zip
      - name: Compilar
        run: |
          rm -rf ci && cp -R cisrc/ci ci && echo "${{ matrix.base }}" > ci/base-commit
          ci/build.sh bakasu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.base }}
          path: dist/bakasu
          retention-days: 14
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          fetch-depth: 1
      - name: Dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: builds
      - name: Empaquetar AnyKernel3
        run: ci/package.sh "$PWD/zip" builds/build-*
      - uses: actions/upload-artifact@v4
        with:
          name: sapphire-bakasu-anykernel3
          path: zip
          retention-days: 30
