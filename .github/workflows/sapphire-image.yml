name: sapphire BakaSU+susfs (Image + AnyKernel3)
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'   # a diario: compila si Angel movió lineage-23.2 o cambió ci/kernels.txt
jobs:
  matriz:
    runs-on: ubuntu-24.04
    outputs:
      bases: ${{ steps.m.outputs.bases }}
      clave: ${{ steps.m.outputs.clave }}
      hecho: ${{ steps.c.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: m
        run: ci/matriz.sh
      - id: c
        uses: actions/cache/restore@v4
        with:
          path: hecho.txt
          key: zip-${{ steps.m.outputs.clave }}
          lookup-only: true
  build:
    needs: matriz
    if: github.event_name != 'schedule' || needs.matriz.outputs.hecho != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.matriz.outputs.bases) }}
        variante: [bakasu, bakasu-ds]
    steps:
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Código del kernel (Angel)
        uses: actions/checkout@v4
        with:
          repository: The-Angel-Place-Sapphire/kernel_xiaomi_sapphire
          ref: ${{ matrix.base }}
          fetch-depth: 1
      - name: Scripts de CI
        uses: actions/checkout@v4
        with:
          path: cisrc
          sparse-checkout: ci
          fetch-depth: 1
      - name: Dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio lz4 dwarves python3 zip
      - name: Compilar
        run: |
          rm -rf ci && cp -R cisrc/ci ci && echo "${{ matrix.base }}" > ci/base-commit
          ci/build.sh ${{ matrix.variante }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.variante }}--${{ matrix.base }}
          path: dist/${{ matrix.variante }}
          retention-days: 14
  package:
    needs: [matriz, build]
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          fetch-depth: 1
      - name: Dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: builds
      - name: Empaquetar AnyKernel3
        run: |
          ci/package.sh "$PWD/zip/bakasu" builds/build-bakasu--*
          ci/package.sh "$PWD/zip/bakasu-droidspaces" builds/build-bakasu-ds--* \
            || echo "::warning::sin zip de Droidspaces: ningún kernel de esa variante pasó"
      - uses: actions/upload-artifact@v4
        with:
          name: sapphire-bakasu-anykernel3
          path: zip
          retention-days: 30
      - run: date -u > hecho.txt
      - uses: actions/cache/save@v4
        with:
          path: hecho.txt
          key: zip-${{ needs.matriz.outputs.clave }}
